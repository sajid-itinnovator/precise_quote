<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1636" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background with rounded edges -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner boundary ring -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />

  <!-- Precision Architect / Estimation crosshairs -->
  <line x1="256" y1="46" x2="256" y2="76" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="256" y1="436" x2="256" y2="466" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="46" y1="256" x2="76" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="436" y1="256" x2="466" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Central "PQ" Monogram -->
  <text x="256" y="325"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="195"
        letter-spacing="-4"
        fill="url(#textGrad)"
        filter="url(#dropShadow)">PQ</text>

  <!-- Small tagline dot / precision compass point -->
  <circle cx="256" cy="380" r="7" fill="#38bdf8" opacity="0.9" />
</svg>
